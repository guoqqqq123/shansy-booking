<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>享洗管理後台</title>
<style>
body{margin:0;background:#f7f2ed;color:#4b3e38;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{background:#efe1d8;padding:22px}main{max-width:850px;margin:auto;padding:14px;display:grid;gap:14px}.card{background:#fffdfa;border:1px solid #eadbd2;border-radius:16px;padding:16px}h1{font-size:24px;margin:6px 0}h2{font-size:18px;margin:0 0 12px}label{font-size:12px;color:#88766c;display:block;margin:8px 0 4px}input,select,button{font:inherit;padding:10px;border:1px solid #e4d5cc;border-radius:9px;background:white;color:#493c36;max-width:100%}button{background:#efdfd7;cursor:pointer;font-weight:600}.person{border:1px solid #eadbd2;border-radius:12px;padding:10px;margin:8px 0}.person button{float:right}.on{background:#e1eee3}.off{background:#f7e4e1}.small{font-size:12px;color:#88766c;line-height:1.6}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;border-bottom:1px solid #eadbd2;padding:9px 4px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}.warning{background:#fff3dc;border-radius:10px;padding:10px;font-size:12px;line-height:1.6}@media(min-width:700px){main{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
</style><header><div style="font-size:12px;letter-spacing:2px">SHANSY AT NIGHT</div><h1>享洗｜管理後台</h1><div class="small">員工排班・不固定休假・套餐設定</div></header>
<main><section class="card"><h2>① 每日排班</h2><label>選擇日期</label><input id="date" type="date"><p class="small">每一天獨立設定，不固定星期休假。</p><div id="staff"></div><div id="msg" class="small">變更會暫存在這台裝置。</div></section>
<section class="card"><h2>② 新增員工</h2><label>姓名</label><input id="newname" placeholder="員工姓名"><label>職務</label><select id="role"><option>員工</option><option>店長</option></select><p><button id="addstaff">新增員工</button></p></section>
<section class="card wide"><h2>③ 套餐設定</h2><div class="warning">先保留資料庫原有套餐；這裡是介面原型，編輯不會同步到 Supabase。</div><div style="overflow:auto"><table><thead><tr><th>套餐名稱</th><th>價格</th><th>分鐘</th><th></th></tr></thead><tbody id="services"></tbody></table></div><div class="row"><div><label>套餐名稱</label><input id="sn"></div><div><label>價格</label><input id="sp" type="number"></div><div><label>分鐘</label><input id="sd" type="number"></div><div style="align-self:end"><button id="addservice">新增套餐</button></div></div></section>
<section class="card wide"><h2>④ 正式上線前</h2><p class="small">這是可操作的前端原型，尚未連線 Supabase、沒有管理員登入，也不能接收客人預約。下一步需接上現有資料庫、設定登入與資料權限，再部署成網址。請勿把資料庫密碼或 service_role key 放進網頁。</p></section></main>
<script>
const ds=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}};
let people=ds('shansy_people',[{id:1,name:'萱',role:'店長'},{id:3,name:'琦',role:'員工'},{id:4,name:'曼',role:'員工'},{id:5,name:'娟',role:'員工'},{id:6,name:'臻',role:'員工'}]);
let services=ds('shansy_services',[{name:'初享・經典洗',price:899,duration:70},{name:'舒享・精油舒壓',price:1299,duration:70},{name:'森享・深層頭皮',price:1699,duration:120},{name:'柔享・深層修護',price:1699,duration:120},{name:'奢享・森萃極致',price:2899,duration:150}]);
let shifts=ds('shansy_shifts',{});const date=document.querySelector('#date');date.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
function save(){localStorage.setItem('shansy_people',JSON.stringify(people));localStorage.setItem('shansy_services',JSON.stringify(services));localStorage.setItem('shansy_shifts',JSON.stringify(shifts));document.querySelector('#msg').textContent='已存在這台裝置的瀏覽器，尚未同步線上資料庫。'}
function renderPeople(){let box=document.querySelector('#staff');box.innerHTML='';let day=shifts[date.value]||{};people.forEach(p=>{let x=day[p.id]||{working:false,start:'19:30',end:'01:00'};let d=document.createElement('div');d.className='person';d.innerHTML='<b>'+p.name+'</b> <span class="small">('+p.role+')</span><button class="'+(x.working?'on':'off')+'">'+(x.working?'上班中':'設為上班')+'</button><div class="small">'+(x.working?'當天上班':'當天休假')+'</div>';d.querySelector('button').onclick=()=>{x.working=!x.working;day[p.id]=x;shifts[date.value]=day;save();renderPeople()};if(x.working){let r=document.createElement('div');r.className='row';r.innerHTML='<div><label>上班時間</label><input type="time" value="'+x.start+'"></div><div><label>下班時間</label><input type="time" value="'+x.end+'"></div>';let ins=r.querySelectorAll('input');ins[0].onchange=e=>{x.start=e.target.value;day[p.id]=x;shifts[date.value]=day;save()};ins[1].onchange=e=>{x.end=e.target.value;day[p.id]=x;shifts[date.value]=day;save()};d.append(r)}box.append(d)})}
function renderServices(){let b=document.querySelector('#services');b.innerHTML='';services.forEach((s,i)=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+s.name+'</td><td>'+s.price+'</td><td>'+s.duration+'</td><td><button>編輯</button></td>';tr.querySelector('button').onclick=()=>{let n=prompt('套餐名稱',s.name);if(n===null)return;let p=prompt('價格',s.price);if(p===null)return;let m=prompt('分鐘',s.duration);if(m===null)return;if(!n.trim()||+p<0||+m<1||!Number.isFinite(+p)||!Number.isFinite(+m)){alert('請檢查輸入');return}services[i]={name:n.trim(),price:+p,duration:+m};save();renderServices()};b.append(tr)})}
date.onchange=renderPeople;document.querySelector('#addstaff').onclick=()=>{let n=document.querySelector('#newname').value.trim();if(!n)return alert('請輸入姓名');people.push({id:Math.max(0,...people.map(p=>p.id))+1,name:n,role:document.querySelector('#role').value});document.querySelector('#newname').value='';save();renderPeople()};
document.querySelector('#addservice').onclick=()=>{let n=document.querySelector('#sn').value.trim(),p=+document.querySelector('#sp').value,m=+document.querySelector('#sd').value;if(!n||!Number.isFinite(p)||p<0||!Number.isFinite(m)||m<1)return alert('請填好套餐名稱、價格與分鐘');services.push({name:n,price:p,duration:m});save();renderServices()};renderPeople();renderServices();
</script></html>
